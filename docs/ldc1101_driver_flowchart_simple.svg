  <text
     x="640"
     y="570"
     font-size="16"
     font-weight="700"
     fill="#1e293b"
     text-anchor="middle"
     id="text29">SPI transport + register map</text>
  <text
     x="640"
     y="596"
     font-size="12.5"
     fill="#334155"
     text-anchor="middle"
     id="text30">ldc_read(addr|0x80) · ldc_write(addr&amp;0x7F), 16-bit SPI mode 0</text>
  <text
     x="640"
     y="616"
     font-size="12.5"
     fill="#334155"
     text-anchor="middle"
     id="text31">pins &amp; bus from platformio.ini build flags (LDC_MOSI/MISO/SCK/CS, host, clock)</text>
