<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="api" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <linearGradient id="cfg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <linearGradient id="rd"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <linearGradient id="hal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="42" font-size="28" font-weight="700" fill="#0f172a">Inside the LDC1101 Driver  (lib/LDC1101)</text>
  <text x="40" y="68" font-size="15" fill="#475569">A clean, C-callable HAL: translate sensor specs into register values, run conversions, return Rp &amp; L — nothing application-specific.</text>

  <!-- ================= PUBLIC API BAND ================= -->
  <text x="40" y="92" font-size="13" font-weight="700" fill="#3730a3" letter-spacing="1">PUBLIC C API &#8212; ldc1101.h, extern "C"  (no C++ types leak through)</text>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="40"   y="100" width="220" height="62" rx="10" fill="url(#api)" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="150" y="127" fill="#1e1b4b">ldc1101_init()</text>
    <text x="150" y="148" font-size="11.5" font-weight="400" fill="#312e81">SPI bus up · read CHIP_ID 0x3F</text>

    <rect x="285" y="100" width="220" height="62" rx="10" fill="url(#api)" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="395" y="127" fill="#1e1b4b">ldc1101_configure()</text>
    <text x="395" y="148" font-size="11.5" font-weight="400" fill="#312e81">specs &#8594; register values</text>

    <rect x="530" y="100" width="220" height="62" rx="10" fill="url(#api)" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="640" y="127" fill="#1e1b4b">ldc1101_read(C)</text>
    <text x="640" y="148" font-size="11.5" font-weight="400" fill="#312e81">&#8594; { Rp_ohms, L_uH, t_ms }</text>

    <rect x="775" y="100" width="220" height="62" rx="10" fill="url(#api)" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="885" y="127" fill="#1e1b4b">ldc1101_sleep()</text>
    <text x="885" y="148" font-size="11.5" font-weight="400" fill="#312e81">START_CONFIG = 1</text>

    <rect x="1020" y="100" width="220" height="62" rx="10" fill="url(#api)" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="1130" y="127" fill="#1e1b4b">ldc1101_wake()</text>
    <text x="1130" y="148" font-size="11.5" font-weight="400" fill="#312e81">START_CONFIG = 0</text>
  </g>

  <!-- lane divider -->
  <line x1="640" y1="184" x2="640" y2="548" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ================= configure() COLUMN ================= -->
  <text x="40" y="200" font-size="14" font-weight="700" fill="#1e40af">ldc1101_configure(L, C, Q, mode, speed, switch)  &#8212; spec &#8594; registers</text>

  <g text-anchor="middle">
    <rect x="40" y="210" width="560" height="30" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
    <text x="320" y="230" font-size="12.5" fill="#1e3a8a">optional: drive external switch GPIO, settle 5 ms</text>

    <rect x="40" y="248" width="560" height="74" rx="10" fill="url(#cfg)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="320" y="270" font-size="14" font-weight="700" fill="#1e3a8a">make_rp_set()  &#8594; RP_SET (0x01)</text>
    <text x="320" y="289" font-size="11.5" fill="#1e3a8a">f = 1/(2&#960;&#8730;LC) ·  Rp_est = Q·2&#960;f·L ·  high_Q = (Q &gt; 50)</text>
    <text x="320" y="306" font-size="11.5" fill="#1e3a8a">pick RP_MAX / RP_MIN bins from 8-entry RP table (±25%)</text>

    <rect x="40" y="330" width="275" height="58" rx="10" fill="url(#cfg)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="177" y="352" font-size="13.5" font-weight="700" fill="#1e3a8a">make_tc1() &#8594; TC1 (0x02)</text>
    <text x="177" y="372" font-size="11" fill="#1e3a8a">C1(speed); R1 from f_min &#8594; code</text>

    <rect x="325" y="330" width="275" height="58" rx="10" fill="url(#cfg)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="462" y="352" font-size="13.5" font-weight="700" fill="#1e3a8a">make_tc2() &#8594; TC2 (0x03)</text>
    <text x="462" y="372" font-size="11" fill="#1e3a8a">C2(speed); R2 from RP_MIN &#8594; code</text>

    <rect x="40" y="396" width="560" height="50" rx="10" fill="url(#cfg)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="320" y="417" font-size="13.5" font-weight="700" fill="#1e3a8a">make_dig_conf() &#8594; DIG_CONF (0x04)</text>
    <text x="320" y="435" font-size="11" fill="#1e3a8a">MIN_FREQ bits + RESP_TIME bits (sets response time &amp; conversion time)</text>

    <rect x="40" y="454" width="560" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="320" y="475" font-size="13.5" font-weight="700" fill="#1e3a8a">write sequence (with chip asleep)</text>
    <text x="320" y="494" font-size="11.5" fill="#1e3a8a">START_CONFIG=1 &#8594; write RP_SET·TC1·TC2·DIG_CONF</text>
    <text x="320" y="511" font-size="11.5" fill="#1e3a8a">mode branch &#8212; RP+L: ALT=0, D=0   |   LHR: ALT=1, D=1, RCOUNT, OFFSET</text>
    <text x="320" y="528" font-size="11.5" fill="#1e3a8a">INTB_MODE=0 &#8594; START_CONFIG=0 (wake / start converting)</text>
  </g>

  <!-- configure internal arrows -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="320" y1="240" x2="320" y2="248" marker-end="url(#arr)"/>
    <line x1="320" y1="322" x2="320" y2="330" marker-end="url(#arr)"/>
    <line x1="320" y1="388" x2="320" y2="396" marker-end="url(#arr)"/>
    <line x1="320" y1="446" x2="320" y2="454" marker-end="url(#arr)"/>
  </g>

  <!-- ================= read() COLUMN ================= -->
  <text x="660" y="200" font-size="14" font-weight="700" fill="#166534">ldc1101_read(C)  &#8594; { Rp, L, timestamp }</text>

  <g text-anchor="middle">
    <rect x="660" y="210" width="580" height="30" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.3"/>
    <text x="950" y="230" font-size="12.5" fill="#14532d">dispatch on current_mode</text>

    <!-- RP+L sub-path -->
    <rect x="660" y="250" width="280" height="62" rx="10" fill="url(#rd)" stroke="#16a34a" stroke-width="1.5"/>
    <text x="800" y="272" font-size="13" font-weight="700" fill="#14532d">RP+L: poll STATUS / DRDYB</text>
    <text x="800" y="290" font-size="10.8" fill="#14532d">read RP_DATA (0x21/22) &#8594; x</text>
    <text x="800" y="305" font-size="10.8" fill="#15803d">NO_SENSOR_OSC / timeout &#8594; NaN</text>

    <rect x="660" y="322" width="280" height="56" rx="10" fill="url(#rd)" stroke="#16a34a" stroke-width="1.5"/>
    <text x="800" y="344" font-size="12.5" font-weight="700" fill="#14532d">Rp from RP_MAX·RP_MIN·x</text>
    <text x="800" y="362" font-size="10.8" fill="#14532d">(high-Q branch uses RP_MIN/(1&#8722;x))</text>

    <!-- LHR sub-path -->
    <rect x="960" y="250" width="280" height="128" rx="10" fill="url(#rd)" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1100" y="276" font-size="13" font-weight="700" fill="#14532d">LHR: high-res L</text>
    <text x="1100" y="296" font-size="10.8" fill="#14532d">wait t_CONV = (55 + RCOUNT·16)/f_CLKIN</text>
    <text x="1100" y="314" font-size="10.8" fill="#14532d">read LHR_DATA 24-bit (0x38&#8211;3A)</text>
    <text x="1100" y="334" font-size="10.8" fill="#15803d">Rp_ohms = NaN  (L-only mode)</text>

    <!-- merge: frequency -->
    <rect x="660" y="392" width="580" height="46" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="950" y="412" font-size="13" font-weight="700" fill="#14532d">recover oscillator frequency f</text>
    <text x="950" y="430" font-size="11" fill="#14532d">from L_DATA (0x23/24) · response-time periods  —or—  LHR raw · f_CLKIN</text>

    <rect x="660" y="446" width="580" height="44" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="950" y="467" font-size="13" font-weight="700" fill="#14532d">L = 1 / ( (2&#960;f)&#178; · C )   &#8594;  L_uH</text>
    <text x="950" y="483" font-size="0.1" fill="#14532d"> </text>

    <rect x="660" y="498" width="580" height="42" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
    <text x="950" y="524" font-size="14" font-weight="700" fill="#14532d">return  ldc1101_measurement_t { Rp_ohms, L_uH, timestamp_ms }</text>
  </g>

  <!-- read internal arrows -->
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="800" y1="240" x2="800" y2="250" marker-end="url(#arr)"/>
    <line x1="1100" y1="240" x2="1100" y2="250" marker-end="url(#arr)"/>
    <line x1="800" y1="312" x2="800" y2="322" marker-end="url(#arr)"/>
    <line x1="800" y1="378" x2="800" y2="392" marker-end="url(#arr)"/>
    <line x1="1100" y1="378" x2="1100" y2="392" marker-end="url(#arr)"/>
    <line x1="950" y1="438" x2="950" y2="446" marker-end="url(#arr)"/>
    <line x1="950" y1="490" x2="950" y2="498" marker-end="url(#arr)"/>
  </g>

  <!-- API -> column arrows -->
  <path d="M395,162 V178 H320 V210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M640,162 V178 H950 V210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= HAL / PLATFORM BAND ================= -->
  <rect x="40" y="556" width="1200" height="132" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="582" font-size="13" font-weight="700" fill="#92400e" letter-spacing="1">PLATFORM / HAL LAYER &#8212; ESP-IDF spi_master + gpio  (ESP32-specific, not portable Arduino)</text>

  <g text-anchor="middle">
    <rect x="60" y="594" width="360" height="80" rx="10" fill="url(#hal)" stroke="#d97706" stroke-width="1.5"/>
    <text x="240" y="618" font-size="13.5" font-weight="700" fill="#7c2d12">SPI transport</text>
    <text x="240" y="638" font-size="11" fill="#7c2d12">ldc_read(addr|0x80)  ·  ldc_write(addr&amp;0x7F)</text>
    <text x="240" y="655" font-size="11" fill="#7c2d12">16-bit, SPI mode 0, CS pre/post-trans</text>

    <rect x="440" y="594" width="360" height="80" rx="10" fill="url(#hal)" stroke="#d97706" stroke-width="1.5"/>
    <text x="620" y="618" font-size="13.5" font-weight="700" fill="#7c2d12">Pins &amp; bus from build flags</text>
    <text x="620" y="638" font-size="11" fill="#7c2d12">LDC_MOSI · MISO · SCK · CS</text>
    <text x="620" y="655" font-size="11" fill="#7c2d12">LDC_SPI_HOST · LDC_SPI_CLOCK_HZ  (platformio.ini)</text>

    <rect x="820" y="594" width="400" height="80" rx="10" fill="url(#hal)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1020" y="618" font-size="13.5" font-weight="700" fill="#7c2d12">Register map  (datasheet formulas)</text>
    <text x="1020" y="638" font-size="10.6" fill="#7c2d12">RP_SET·TC1·TC2·DIG_CONF·ALT·INTB·START_CONFIG</text>
    <text x="1020" y="655" font-size="10.6" fill="#7c2d12">RP/L data · STATUS · LHR_RCOUNT/OFFSET/DATA · CHIP_ID</text>
  </g>

  <!-- columns -> HAL (via SPI) -->
  <path d="M320,540 V548 H240 V594" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrL)"/>
  <text x="210" y="572" font-size="10.5" fill="#b45309" text-anchor="middle">ldc_write</text>
  <path d="M950,540 V548 H300 V594" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrL)"/>
  <text x="360" y="572" font-size="10.5" fill="#b45309" text-anchor="middle">ldc_read</text>
  <path d="M620,594 V548" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrL)"/>

  <text x="1240" y="708" font-size="11" fill="#94a3b8" text-anchor="end">CHIP_ID checked at init · RP+L and LHR modes · f_CLKIN = 16 MHz</text>
</svg>
